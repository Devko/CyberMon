name: Nightly data refresh

# Runs the full pipeline against live sources, commits the refreshed
# site/data/ (including the append-only history/nvd_backlog.csv and
# history/nvd_throughput.csv, which CANNOT be regenerated), then deploys
# the site to GitHub Pages.
# site/data/ (including the append-only history/ CSVs — nvd_backlog.csv
# and rescore_log.csv — which CANNOT be regenerated), then deploys the
# site to GitHub Pages.
# site/data/ (including the append-only history files — nvd_backlog.csv
# and the KEV changelog's kev_changelog.csv + kev_state.json — which
# CANNOT be regenerated), then deploys the site to GitHub Pages.

on:
  schedule:
    # 02:43 UTC — off-peak, deliberately not on the hour (GitHub delays
    # and drops :00 cron jobs under load).
    - cron: "43 2 * * *"
    # Catch-up attempt for a transient upstream outage; the gate job
    # below turns this into a ~10s no-op once the night is green.
    - cron: "43 8 * * *"
  workflow_dispatch:

# Never let two nightly runs overlap (the data commit + history append
# is not safe to race). Queue instead of cancel so a manual dispatch
# during the scheduled run still happens.
concurrency:
  group: cybermon-nightly
  cancel-in-progress: false

jobs:
  # Third parties have bad mornings. On 2026-08-30 abuse.ch served an
  # expired certificate at 02:46 UTC and was healthy again by 10:00, but
  # the refresh gets exactly one attempt a night, so the site sat three
  # days stale over an outage that fixed itself. The catch-up cron above
  # buys a second attempt for that whole class of failure. It changes no
  # invariant: a broken source still breaks the run, nothing stale ever
  # deploys, and a night that is genuinely broken still ends red twice.
  gate:
    name: Decide whether this attempt is needed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Skip the catch-up attempt when tonight already succeeded
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Empty for workflow_dispatch; the cron string for schedules.
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Everything except the catch-up cron runs unconditionally: the
          # primary 02:43 schedule, and every manual dispatch.
          if [ "$SCHEDULE" != "43 8 * * *" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Primary attempt (schedule=${SCHEDULE:-dispatch}); running."
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          # This workflow's own successful runs started today. The run asking
          # the question is in_progress, not success, so it can never match
          # itself. grep exits 1 when there is no match, hence the || true.
          green="$(gh run list --workflow=nightly.yml --status=success \
            --limit 30 --json createdAt --jq '.[].createdAt' \
            | grep -c "^$today" || true)"
          if [ "${green:-0}" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "A nightly run already succeeded on $today; nothing to catch up."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No successful run yet on $today; retrying the refresh."
          fi

  refresh:
    needs: gate
    # Fail-safe direction on purpose: skip ONLY on an explicit 'false'.
    # A missing output or an outright gate failure must fall through to
    # running the refresh -- the gate is an optimisation, never a
    # gatekeeper that can silently retire the nightly. !cancelled() is
    # what lets a failed gate still reach this job.
    if: ${{ !cancelled() && needs.gate.outputs.should_run != 'false' }}
    name: Run pipeline and commit data
    runs-on: ubuntu-latest
    # Slow upstreams (GDELT pacing, keyless NVD paging); allow headroom.
    timeout-minutes: 120
    permissions:
      contents: write
      # For the failure-alert step below (gh issue create/comment).
      issues: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt

      # requirements-dev carries pytest, needed by the post-pipeline
      # validation gate below (the nightly's data commit is [skip ci], so
      # this run is the only thing that ever tests the data it ships).
      - name: Install pipeline dependencies
        run: |
          pip install -r pipeline/requirements.txt \
                      -r pipeline/requirements-dev.txt

      # NVD incremental-sync state (per-CVE status map + the throughput
      # tracker's since-dates). A cache miss is mostly harmless: the
      # pipeline does a full corpus sweep and rebuilds the map — but the
      # throughput diff then has no baseline, so that night appends no
      # transition row and observed queue durations restart accumulating
      # (the committed CSV keeps everything already measured). The key is
      # unique per run so the updated state is saved after every night;
      # restore-keys picks up the newest previous one.
      - name: Restore NVD sync state
        uses: actions/cache@v4
        with:
          path: .cache/nvd_status_state.json.gz
          key: nvd-status-state-${{ github.run_id }}
          restore-keys: |
            nvd-status-state-

      # Market-hype sync state (per-term monthly counts + HN backfill
      # queue). Same self-healing semantics as the NVD state above.
      - name: Restore market-hype sync state
        uses: actions/cache@v4
        with:
          path: .cache/market_state.json
          key: market-state-${{ github.run_id }}
          restore-keys: |
            market-state-

      # ATT&CK per-release stats state (immutable derived stats per
      # enterprise release). Same self-healing semantics as the NVD state
      # above — and doubly so: a miss here is first reconstructed from the
      # published site/data/attack_churn.json, so it never re-triggers the
      # full ~40-bundle backfill.
      - name: Restore ATT&CK sync state
        uses: actions/cache@v4
        with:
          path: .cache/attack_state.json
          key: attack-state-${{ github.run_id }}
          restore-keys: |
            attack-state-

      # EPSS report-card sync state (day-before score per KEV entry —
      # historical scores are immutable, each pair is looked up once).
      # Same self-healing semantics as the ATT&CK state above, and doubly
      # so: a miss here is first reconstructed from the published
      # site/data/epss_report.json, so it never re-triggers the historical
      # backfill (which is batch-capped anyway: --epss-backfill-batch).
      - name: Restore EPSS report-card sync state
        uses: actions/cache@v4
        with:
          path: .cache/epss_report_state.json
          key: epss-report-state-${{ github.run_id }}
          restore-keys: |
            epss-report-state-

      # NOTE: the silent-rescores diff state deliberately has NO cache
      # entry here — it is committed at site/data/history/rescore_state.json
      # next to its append-only log (an actions/cache copy once restored a
      # stale state after two failed nights and double-appended events).

      # If this step fails, the job fails and the deploy job below is
      # skipped — stale/broken data is never deployed. Do NOT add
      # continue-on-error here.
      - name: Run pipeline
        id: pipeline
        env:
          # Optional; the pipeline tolerates an empty value and falls
          # back to slower keyless NVD paging.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python -m pipeline --out site/data

      # The gate that stops a drifted claim from shipping. contracts.py
      # already validates every output's structure in-pipeline, but the
      # claims audits (editorial copy checked against the committed data)
      # live only in pytest — and the data commit below carries
      # "[skip ci]", so CI never re-runs on top of it. Without this step
      # a headline whose number moved overnight deploys silently and
      # stays live until someone happens to push to main.
      #
      # Same loud-failure policy as the fetchers: if the refreshed data
      # contradicts the copy, the run fails and nothing is committed or
      # deployed. Fix the copy or the pipeline, never the test.
      - name: Validate refreshed data against editorial claims
        id: claims
        run: python -m pytest pipeline/tests -q

      - name: Commit and push refreshed data
        run: |
          git config user.name "cybermon-bot"
          git config user.email "cybermon-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: nightly refresh $(date -u +%Y-%m-%d) [skip ci]"
            # Tolerate commits that landed on main while the pipeline ran.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Once per ISO week, freeze an immutable snapshot tag on HEAD. The
      # append-only site/data/history/ CSVs (nvd_backlog.csv,
      # nvd_throughput.csv) CANNOT be regenerated
      # (this repo is their only copy), so a weekly tag is a rollback point if
      # a file is ever corrupted or truncated by a bad run. Insurance, not
      # append-only site/data/history/ CSVs (nvd_backlog.csv and
      # rescore_log.csv) CANNOT be regenerated (this repo is their only
      # copy), so a weekly tag is a rollback point if a file is ever
      # corrupted or truncated by a bad run. Insurance, not
      # append-only history files (site/data/history/nvd_backlog.csv, and
      # the KEV changelog's kev_changelog.csv + kev_state.json) CANNOT be
      # regenerated (this repo is their only copy), so a weekly tag is a
      # rollback point if a file is ever corrupted or truncated by a bad
      # run. Insurance, not
      # the product: every failure mode here is swallowed so it can never
      # take down the refresh itself (the pipeline-run step above still must
      # NOT get continue-on-error — this leniency is for the backup only).
      - name: Push weekly history backup tag
        run: |
          tag="data-backup-$(date -u +%G-W%V)"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Backup tag ${tag} already on origin; nothing to do."
          else
            # Annotated tag so the bot identity (configured above) is
            # recorded as the tagger.
            git tag -a "${tag}" -m "Weekly immutable snapshot of site/data (incl. history/)" HEAD \
              && git push origin "refs/tags/${tag}" \
              || echo "::warning::Could not push backup tag ${tag} (non-fatal; will retry next night this week)."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # LinkedIn-carousel PDFs (one per module page), rendered from the
      # freshly committed data. Built here, after the data commit and right
      # before the artifact upload, so the PDFs ship inside the Pages
      # artifact without ever touching git history — binary PDFs regenerated
      # every night would bloat the repo (site/carousels/ is gitignored).
      #
      # Every carousel step is continue-on-error ON PURPOSE: the PDFs are
      # nice-to-have build products, and a single module's rendering bug
      # must never block the site deploy (it did, for two days — the site
      # served stale data while fresh commits piled up on main). A carousel
      # failure still leaves a paper trail via the notify step below.
      - name: Install Playwright
        id: carousel-deps
        continue-on-error: true
        run: pip install -r pipeline/requirements-dev.txt

      # --with-deps also apt-installs the browser's system libraries.
      - name: Install headless Chromium
        id: carousel-browser
        continue-on-error: true
        run: playwright install --with-deps chromium

      - name: Build carousel PDFs
        id: carousels
        continue-on-error: true
        run: python3 tools/make_carousels.py --out site/carousels

      # Animated social clips from the same freshly committed data, under the
      # same non-blocking rule as the PDFs above: a broken clip must never keep
      # the site on stale data.
      - name: Build motion clips
        id: motion
        continue-on-error: true
        run: python3 tools/make_motion.py --out site/motion

      - name: Report social build-product failure (non-blocking)
        if: steps.carousels.outcome == 'failure' || steps.carousel-deps.outcome == 'failure' || steps.carousel-browser.outcome == 'failure' || steps.motion.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          issue="$(gh issue list --label nightly-failure --state open \
            --json number --jq '.[0].number // empty')"
          body="Social build product failed — carousels=${{ steps.carousels.outcome }}, motion=${{ steps.motion.outcome }} (deploy proceeded without them): $RUN_URL"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create \
              --title "Nightly social build products are failing" \
              --label nightly-failure \
              --body "$body"
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # If anything above failed, leave a paper trail where humans actually
      # look. One open issue labeled nightly-failure collects every failing
      # run as a comment, so a week of breakage threads in a single issue
      # instead of spamming a new one per night.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          # Explicit repo so gh works even if the failure hit the checkout.
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Which stage broke. The two classes have different owners and
          # urgencies: a pipeline failure is usually an upstream outage that
          # clears itself, while a claims failure means the refreshed data
          # contradicts copy the site is already serving. Both used to
          # comment the identical sentence, so a run of them read as one
          # long outage rather than separate incidents.
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          CLAIMS_OUTCOME: ${{ steps.claims.outcome }}
        run: |
          # A skipped stage means an earlier one already failed, so test
          # the pipeline first; an empty pair means the job died before
          # either ran (checkout, dependency install).
          case "${PIPELINE_OUTCOME}/${CLAIMS_OUTCOME}" in
            failure/*) stage="the pipeline run (fetch/build — often an upstream outage)" ;;
            */failure) stage="the editorial claims audit (refreshed data contradicts site copy)" ;;
            *)         stage="a step outside the pipeline and claims stages" ;;
          esac
          # Make sure the label exists (first failure on a fresh fork);
          # --force makes this a no-op when it already does.
          gh label create nightly-failure \
            --description "The nightly data refresh is broken" \
            --color D93F0B --force || true
          issue="$(gh issue list --label nightly-failure --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Nightly refresh failed at ${stage}: $RUN_URL"
          else
            gh issue create \
              --title "Nightly data refresh is failing" \
              --label nightly-failure \
              --body "The nightly data refresh failed at ${stage} — nothing was deployed. First failing run: $RUN_URL"
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    # Shared with ci.yml's deploy job so the two workflows never race
    # a Pages deployment. Queue, don't cancel.
    concurrency:
      group: cybermon-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # A failure issue nobody closes stops being a signal. #25 was opened on
  # 2026-07-30 and stayed open through eight consecutive green nights, so
  # three unrelated outages (an early-August pair, the rejection-share
  # claim, an abuse.ch certificate expiry) all threaded into it and read as
  # one continuous outage. Close it when a full run — data committed AND
  # site deployed — actually succeeds, so an open issue means "broken now".
  resolve:
    name: Close the failure issue on a green run
    needs: [refresh, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close any open nightly-failure issue
        # Bookkeeping must never fail a run that already deployed — same
        # rule as the backup tag and the social build products above.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Loop, not [0]: the social-build-product alert opens a second
          # issue under the same label, and a green run resolves both.
          gh issue list --label nightly-failure --state open \
            --json number --jq '.[].number' \
          | while read -r issue; do
              [ -n "$issue" ] || continue
              gh issue close "$issue" --reason completed \
                --comment "Nightly refresh is green again — data committed and site deployed: $RUN_URL"
            done
